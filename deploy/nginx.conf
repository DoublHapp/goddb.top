# goddb.top 前端静态站 + API 反向代理
# 对应原 Vercel 配置：SPA rewrite 到 index.html（try_files 语义一致）

# HTTP → HTTPS 重定向（保留证书验证路径）
server {
    listen 80;
    listen [::]:80;
    server_name goddb.top www.goddb.top;

    # Let's Encrypt 证书验证路径（certbot webroot 模式，续期使用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name goddb.top www.goddb.top;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # 带内容 hash 的构建资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片 / 字体等静态资源：中等缓存
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 明确静态文件直接服务
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }

    # SPA 路由回退（对应 vercel.json 的 rewrites）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（Spring Boot 后端就绪后生效）
    # 使用 resolver + 变量实现运行时解析：backend 容器未启动时 nginx 也能正常启动，
    # 后端上线后自动联通，无需改动 nginx 配置
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_addr backend;
        proxy_pass http://$backend_addr:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
