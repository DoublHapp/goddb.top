# goddb.top 全栈编排
#
# 当前阶段：
#   - nginx 容器托管前端静态站（dist 构建产物）
#   - redis / rabbitmq 中间件容器已就绪，后端可直接连接
#
# 后续阶段（Spring Boot 后端代码就绪后）：
#   docker compose --profile backend up -d --build
#
# 换服务器迁移：拷贝本目录 + docker compose up -d 即可恢复全部服务
name: goddb

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goddb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - redis
      - rabbitmq
    networks:
      - goddb

  # Spring Boot 后端（预留服务，镜像就绪后取消注释即可启用）
  backend:
    image: goddb-backend:latest
    container_name: goddb-backend
    restart: unless-stopped
    profiles: ["backend"]
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - goddb

  redis:
    image: redis:7-alpine
    container_name: goddb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - goddb

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goddb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: goddb
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - goddb

networks:
  goddb:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
