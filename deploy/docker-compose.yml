# goddb.top 全栈编排
#
# 当前阶段：
#   - nginx 容器托管前端静态站（dist 构建产物）
#   - postgres 数据库（评论区等动态数据）
#   - redis / rabbitmq 中间件容器已就绪，后端可按需连接
#
# 后端启用：
#   docker compose --profile backend up -d --build
#   需先在 deploy/ 目录创建 .env（参考 .env.example），包含 POSTGRES_PASSWORD 与 GODDB_ADMIN_TOKEN
#
# 换服务器迁移：拷贝本目录 + docker compose up -d 即可恢复全部服务
name: goddb

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: goddb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - goddb

  # Spring Boot 后端（评论区 API；默认不启动，启用见文件头注释）
  backend:
    image: goddb-backend:latest
    container_name: goddb-backend
    restart: unless-stopped
    profiles: ["backend"]
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/goddb
      SPRING_DATASOURCE_USERNAME: goddb
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      GODDB_ADMIN_TOKEN: ${GODDB_ADMIN_TOKEN:?GODDB_ADMIN_TOKEN must be set in deploy/.env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - goddb

  postgres:
    image: postgres:17-alpine
    container_name: goddb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goddb
      POSTGRES_USER: goddb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - goddb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goddb -d goddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goddb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - goddb

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goddb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: goddb
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - goddb

networks:
  goddb:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
