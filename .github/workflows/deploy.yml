# goddb.top 自动部署：push 到 main 后云端构建并部署到 VMISS 服务器
#
# 两个 job：
#   - deploy-frontend：构建前端 dist 并 scp 上传到服务器（nginx 即时生效）
#   - deploy-backend：SSH 到服务器 git pull 后 compose 构建并启动后端容器（含 postgres）
name: Deploy goddb.top to VMISS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Decode deploy key
        id: decode_key
        run: |
          DECODED=$(printf '%s' "${{ secrets.GODDB_SSH_KEY_B64 }}" | base64 -d)
          if ! printf '%s' "$DECODED" | grep -q "BEGIN OPENSSH"; then
            echo "DECODE_FAILED: secret content is not a valid key"
            exit 1
          fi
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DECODED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "DECODE_OK"

      - name: Deploy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GODDB_SERVER_HOST }}
          username: ${{ secrets.GODDB_SERVER_USER }}
          port: 2222
          key: |
            ${{ steps.decode_key.outputs.key }}
          source: 'frontend/dist/*'
          target: '/opt/goddb/deploy/dist/'
          strip_components: 2

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode deploy key
        id: decode_key
        run: |
          DECODED=$(printf '%s' "${{ secrets.GODDB_SSH_KEY_B64 }}" | base64 -d)
          if ! printf '%s' "$DECODED" | grep -q "BEGIN OPENSSH"; then
            echo "DECODE_FAILED: secret content is not a valid key"
            exit 1
          fi
          echo "key<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DECODED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "DECODE_OK"

      - name: SSH to server, pull and rebuild backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GODDB_SERVER_HOST }}
          username: ${{ secrets.GODDB_SERVER_USER }}
          port: 2222
          key: |
            ${{ steps.decode_key.outputs.key }}
          script: |
            cd /opt/goddb && git pull
            cd deploy && docker compose --profile backend up -d --build postgres backend
            echo "Backend deployment finished"
