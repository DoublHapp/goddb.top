server:
  port: 8080

spring:
  application:
    name: goddb-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:goddb}
    username: ${DB_USERNAME:goddb}
    password: ${DB_PASSWORD:goddb}
  flyway:
    enabled: true

# Actuator：端点挂在 /api/actuator 下，与 nginx /api 反代对齐
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics

# OpenAPI 文档：与 nginx /api 反代对齐
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

goddb:
  admin-token: ${GODDB_ADMIN_TOKEN:}
